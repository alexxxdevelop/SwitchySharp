<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="assets/styles/popup.css" type="text/css">
    <script src="assets/libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="assets/scripts/logger.js" type="text/javascript"></script>
    <script src="assets/scripts/settings.js" type="text/javascript"></script>
    <script src="assets/scripts/i18n.js" type="text/javascript"></script>
    <script src="assets/scripts/utils.js" type="text/javascript"></script>
    <script src="assets/scripts/plugin.js" type="text/javascript"></script>
    <script src="assets/scripts/profileManager.js" type="text/javascript"></script>
    <script src="assets/scripts/ruleManager.js" type="text/javascript"></script>
    <script src="assets/scripts/core.js" type="text/javascript"></script>
    <script src="assets/scripts/popup.js" type="text/javascript"></script>
</head>
<body data-i18n-values=".style.direction:global_direction;.style.textAlign:global_textAlign">
<div id="menu">
    <div id="directConnection" name="[Direct Connection]" class="item proxy inactive" title="Disable Proxy"
         data-i18n-values="title:proxy_directConnection_help">
        <div class="icon"></div>
        <span data-i18n-content="proxy_directConnection">Direct Connection</span>
    </div>
    <div id="separatorProxies" class="separator"></div>
    <div id="proxies">
        <div class="templateItem" title="">
            <div class="icon"></div>
            <span>Proxy</span>
        </div>
    </div>
    <div id="separatorRules" class="separator"></div>
    <div id="automaticMode" class="item proxy auto"
         title="Automatically choose the proper proxy profile &#13;for each URL, based on Switch Rules."
         data-i18n-values="title:popup_autoSwitchMode_help">
        <div class="icon"></div>
        <span data-i18n-content="popup_autoSwitchMode">Auto Switch Mode</span>
    </div>

    <div id="separatorOptions" class="separator"></div>
    <div id="menuOptions" class="item action">
        <img src="assets/images/options.png"/><span data-i18n-content="popup_options">Options</span>
    </div>
    <div id="menuAbout" class="item action">
        <img src="assets/images/about.png"/><span data-i18n-content="popup_aboutSwitchy">About SwitchySharp</span>
    </div>
</div>

<div id="about">
    <div class="close" title="Close"></div>
    <div class="header">
        <img src="assets/images/icon-128.png" width="56" height="56"/>
        <div>
            <div class="title">SwitchySharp</div>
            <div class="version"><span data-i18n-content="popup_version">version</span>
                <span class="versionNumber">version number here</span></div>
        </div>
    </div>
    <div class="body">
        <table id="developer">
            <tr>
                <td data-i18n-content="popup_developedBy">Developed by</td>
                <td>@alexxxdevelop</td>
            </tr>
            <tr>
                <td data-i18n-content="popup_basedOn">Based on the work of</td>
                <td>@Shyc2001 (SwitchySharp)</td>
            </tr>
        </table>
        <!-- hidden for now, kept for future use -->
        <div class="links" hidden>
            <a href="" id="openMainWebsite" data-i18n-content="popup_switchyWebPage">Switchy! web page</a>
            <a href="" id="openPlusWebsite" data-i18n-content="popup_switchyPlusWebPage">SwitchyPlus web page</a>
            <a href="" id="openSupportWebsite" data-i18n-content="popup_supportAndBugReports">Support &amp; Bug reports</a>
        </div>
    </div>
    <div class="footer">
        <div data-i18n-content="popup_copyright">Copyright &copy; 2026 @alexxxdevelop.<br/>Some rights reserved.</div>
    </div>
</div>
</body>
</html>
